<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Blue City — Do Piloto à Política Pública</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#2858a0; --teal:#468182; --green:#5fb670; --gold:#c9a033; --gold-text:#a87e1e;
    --blue-light:#d6e4f7; --gold-light:#f6ecd0;
    --dark:#1a2e3b; --navy:#121e33; --text:#000000; --muted:#000000; --bg:#f4f8fc;
    --grad:linear-gradient(to bottom right,#1d4789 0%,#295b9c 35%,#468182 70%,#7fc596 100%);
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }

  .topbar { position:sticky; top:0; z-index:100; background:rgba(18,30,51,0.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.08); }
  .topbar-inner { max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .topbar-logo { height:24px; width:auto; display:block; }
  .lang { display:flex; gap:2px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:3px; }
  .lang button { font-family:inherit; background:transparent; border:none; color:rgba(255,255,255,0.6); font-size:11px; font-weight:700; letter-spacing:0.5px; padding:5px 10px; border-radius:5px; cursor:pointer; transition:all 0.2s; }
  .lang button:hover { color:#ffffff; background:rgba(255,255,255,0.08); }
  .lang button.active { color:var(--dark); background:#ffffff; }

  .hero { background:var(--grad); color:#ffffff; padding:72px 24px 64px; }
  .hero-inner { max-width:1080px; margin:0 auto; }
  .label { font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:#ffffff; margin-bottom:20px; display:flex; align-items:center; gap:12px; }
  .label::before { content:''; width:32px; height:1.5px; background:rgba(255,255,255,0.7); }
  h2 { font-size:clamp(32px, 4.6vw, 54px); font-weight:800; line-height:1.1; letter-spacing:-1px; margin-bottom:22px; }
  h2 span { color:#ffffff; }
  p.lead { font-size:clamp(15px, 1.5vw, 18px); line-height:1.7; color:#ffffff; white-space:nowrap; }

  .content { max-width:1080px; margin:0 auto; padding:48px 24px 72px; }
  .section-label { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--teal); margin-bottom:18px; }

  .stairs { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; align-items:end; }
  .stair { cursor:pointer; border-radius:14px; padding:18px 16px; background:#ffffff; border:1px solid rgba(40,88,160,0.1); border-top:4px solid var(--blue); box-shadow:0 2px 12px rgba(0,0,0,0.04); transition:all 0.25s; }
  .stair:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(40,88,160,0.12); }
  .stair.policy { border-top-color:var(--gold); background:linear-gradient(180deg,#fffaf0 0%,#ffffff 60%); }
  .stair.policy:hover { box-shadow:0 8px 24px rgba(168,126,30,0.16); }
  .stair-num { font-size:28px; font-weight:800; color:var(--blue); line-height:1; margin-bottom:12px; }
  .stair.policy .stair-num { color:var(--gold-text); }
  .stair h4 { font-size:13px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; color:var(--dark); margin-bottom:8px; }
  .stair p { font-size:12px; line-height:1.55; color:var(--muted); }
  .stair-1 { min-height:170px; } .stair-2 { min-height:195px; } .stair-3 { min-height:220px; } .stair-4 { min-height:245px; } .stair-5 { min-height:270px; }

  .stairs-legend { display:grid; grid-template-columns:2fr 3fr; gap:12px; margin-top:12px; }
  .stairs-legend span { font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; padding-top:10px; border-top:2px solid var(--blue); color:var(--blue); }
  .stairs-legend span.policy { border-top-color:var(--gold); color:var(--gold-text); }

  .detail { margin-top:56px; }
  .pillar { scroll-margin-top:84px; display:flex; align-items:flex-start; gap:20px; padding:24px 26px; margin-bottom:14px; background:#ffffff; border:1px solid rgba(40,88,160,0.1); border-left:4px solid var(--blue); border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
  .pillar.policy { border-left-color:var(--gold); }
  .pillar .pillar-num { font-size:30px; font-weight:800; color:var(--blue); line-height:1; min-width:44px; }
  .pillar.policy .pillar-num { color:var(--gold-text); }
  .pillar h4 { font-size:15px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; color:var(--dark); margin-bottom:8px; }
  .pillar p { font-size:14px; line-height:1.7; color:var(--text); margin-bottom:10px; }
  .pillar ul { list-style:none; margin-top:6px; }
  .pillar li { font-size:13px; line-height:1.65; color:var(--text); padding-left:18px; position:relative; margin-bottom:4px; }
  .pillar li strong { font-weight:700; color:var(--dark); }
  .pillar li::before { content:''; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:50%; background:var(--blue); }
  .pillar.policy li::before { background:var(--gold); }
  .maplink { display:inline-flex; align-items:center; gap:6px; margin-left:4px; color:var(--blue); font-weight:700; text-decoration:none; border-bottom:1.5px solid rgba(40,88,160,0.35); white-space:nowrap; }
  .maplink:hover { border-bottom-color:var(--blue); }

  .closing { margin-top:36px; padding:28px 32px; background:var(--grad); border-radius:16px; box-shadow:0 4px 18px rgba(40,88,160,0.18); }
  .closing p { font-size:clamp(16px, 1.7vw, 20px); font-weight:700; line-height:1.5; color:#ffffff; }

  @media (max-width:900px) {
    .stairs { grid-template-columns:repeat(2, 1fr); }
    .stair { min-height:auto !important; }
    .stairs-legend { grid-template-columns:1fr 1fr; }
    p.lead { white-space:normal; }
  }
  @media (max-width:720px) {
    .hero { padding:48px 20px 44px; }
    .content { padding:36px 16px 56px; }
    .stairs, .stairs-legend { grid-template-columns:1fr; }
    .pillar { flex-direction:column; gap:8px; padding:20px 18px; }
    .pillar .pillar-num { font-size:24px; }
    .closing { padding:22px 20px; }
    .topbar-inner { padding:12px 16px; }
  }
</style>

function render(l) {
  const d = T[l];
  const n = i => String(i + 1).padStart(2, '0');
  const stairs = d.steps.map((s, i) => `<div onclick="document.getElementById('degrau-${i+1}').scrollIntoView({behavior:'smooth'})" class="stair stair-${i+1}${s.policy ? ' policy' : ''}"><div class="stair-num">${n(i)}</div><h4>${s.t}</h4><p>${s.s}</p></div>`).join('');
  const pillars = d.steps.map((s, i) => `<div class="pillar${s.policy ? ' policy' : ''}" id="degrau-${i+1}"><span class="pillar-num">${n(i)}</span><div><h4>${s.t}</h4><p>${s.p}</p><ul>${s.b.map(x => `<li>${x}</li>`).join('')}</ul></div></div>`).join('');
  document.getElementById('hero').innerHTML = `
    <div class="label">${d.label}</div>
    <h2>${d.title}</h2>
    <p class="lead">${d.lead}</p>`;
  document.getElementById('app').innerHTML = `
    <div class="stairs">${stairs}</div>
    <div class="stairs-legend"><span>${d.legend[0]}</span><span class="policy">${d.legend[1]}</span></div>
    <div class="detail">${pillars}</div>
    <div class="closing"><p>${d.closing}</p></div>`;
}
function setLang(l) {
  ['pt','en','es'].forEach(k => document.getElementById('btn-' + k).classList.toggle('active', k === l));
  document.documentElement.lang = l === 'pt' ? 'pt-BR' : l;
  render(l);
}
setLang((location.hash.replace('#','') in T) ? location.hash.replace('#','') : 'pt');
